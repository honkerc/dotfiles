plugin {
    hyprbars {
        enabled = true                 # 启用 hyprbars 标题栏插件

        # macOS 深色风格（注意：这里 bar_color 是白色，若想深色可改成 rgb(1e1e1e)）
        bar_color = rgb(ffffff)        # 标题栏背景色：白色
        col.text = rgb(333333)         # 标题文字颜色：深灰色

        bar_height = 32                # 标题栏高度（像素）
        bar_text_size = 0              # 标题文字大小，0 表示不显示标题文字
        bar_text_font = SF Pro Display, Helvetica, Sans  # 标题字体优先级

        bar_text_align = center        # 标题文字对齐：居中
        bar_buttons_alignment = left   # 按钮对齐：左侧（macOS 交通灯在左侧）
        bar_padding = 12               # 标题栏左右内边距
        bar_button_padding = 8         # 按钮之间的间距

        bar_blur = true                # 标题栏模糊（需要全局 blur 已开启）
        bar_part_of_window = false     # 标题栏不视为窗口内容的一部分
        bar_precedence_over_border = true  # 标题栏优先于窗口边框
        icon_on_hover = true           # 鼠标悬停时才显示按钮图标

        # 深色模式下的交通灯按钮（红/黄/绿）
        # 语法：hyprbars-button = 背景色, 大小, 图标, 点击命令, 前景色
        # 下面三个只设置了颜色和大小，没写图标和点击命令，所以点击不会有动作
        hyprbars-button = rgb(ff5f57), 14, ,
        hyprbars-button = rgb(febc2e), 14, ,
        hyprbars-button = rgb(28c840), 14, ,

        on_double_click = hyprctl dispatch fullscreen 1  # 双击标题栏切换全屏
        inactive_button_color = rgb(666666)              # 非活动按钮颜色（可能不是官方参数）
    }

    scrolloverview {
        # gesture_distance = 100         # 手势触发距离
        scale = 0.5                   # 预览缩放比例
        workspace_gap = 50            # 工作区之间的间距
        layout = vertical              # 预览布局方向：垂直
        wallpaper = 0                  # 壁纸模式：0=全局，1=每工作区，2=两者
        blur = true                    # 预览时启用模糊
        shadow {
            enabled = true             # 开启阴影
            range = 100                 # 阴影范围
        }
    }
}

# 绑定 Super+P 切换滚动概览
bind = SUPER, p, scrolloverview:overview, "toggle all"
